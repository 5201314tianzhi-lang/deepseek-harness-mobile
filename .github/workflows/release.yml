name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to publish (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'platforms;android-36 platform-tools build-tools;36.0.0'
          accept-android-sdk-licenses: 'true'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download runtime snapshot from upstream releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/assets
          asset_url=$(gh api repos/kelai141/dsh-mobile-apk/releases/latest \
            --jq '.assets[] | select(.name == "snapshot-x86_64.tar.xz") | .url')
          [ -n "$asset_url" ] || { echo "snapshot-x86_64.tar.xz not found upstream"; exit 1; }
          curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "$asset_url" -o app/src/main/assets/snapshot.tar.xz
          ls -lh app/src/main/assets/snapshot.tar.xz

      - name: Generate CI signing key
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass android \
            -keypass android -dname "CN=dsh-mobile, OU=ci, O=dsh, L=cn, S=cn, C=cn"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "dsh-apk-${{ steps.tag.outputs.tag }}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body: |
            dsh Android shell APK ${{ steps.tag.outputs.tag }}
          files: dsh-apk-${{ steps.tag.outputs.tag }}.apk
