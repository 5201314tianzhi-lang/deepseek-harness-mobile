name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to publish (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  diagnose-snapshot:
    name: Diagnose snapshot file modes
    runs-on: ubuntu-latest
    steps:
      - name: Download arm64 snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset_url=$(gh api repos/kelai141/dsh-mobile-apk/releases/tags/v0.10.4 \
            --jq '.assets[] | select(.name == "snapshot-arm64.tar.xz") | .url')
          curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "$asset_url" -o snapshot.tar.xz
      - name: Inspect key file modes
        run: |
          python3 - <<'EOF'
          import tarfile
          t = tarfile.open('snapshot.tar.xz', 'r:xz')
          wanted = ('usr/bin/node', 'usr/bin/bash', 'usr/lib/libtermux-exec-ld-preload.so')
          for m in t.getmembers():
              if m.name.endswith(wanted) or 'bin.js' in m.name:
                  print(f"{m.name}: mode={oct(m.mode)} size={m.size}")
          for cand in ('usr/etc/tls/openssl.cnf', 'usr/etc/ssl/openssl.cnf', 'usr/etc/tls/openssl.cnf.dist'):
              hit = [m for m in t.getmembers() if m.name == cand]
              print(cand, "->", "FOUND mode=" + oct(hit[0].mode) if hit else "missing")
          total = sum(m.size for m in t.getmembers())
          print("entries:", len(t.getmembers()), "total bytes:", total)
          EOF

  build:
    name: Build (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            snapshot_asset: snapshot-arm64.tar.xz
          - abi: x86_64
            snapshot_asset: snapshot-x86_64.tar.xz
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'platforms;android-36 platform-tools build-tools;36.0.0 ndk;27.2.12479018'
          accept-android-sdk-licenses: 'true'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download runtime snapshot (${{ matrix.abi }}) from upstream releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/assets
          asset_url=$(gh api repos/kelai141/dsh-mobile-apk/releases/tags/v0.10.4 \
            --jq '.assets[] | select(.name == "${{ matrix.snapshot_asset }}") | .url')
          [ -n "$asset_url" ] || { echo "${{ matrix.snapshot_asset }} not found upstream"; exit 1; }
          curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "$asset_url" -o app/src/main/assets/snapshot.tar.xz
          ls -lh app/src/main/assets/snapshot.tar.xz

      - name: Get or create CI signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Reuse the keystore persisted on the v0.1.0 release so every build
          # shares one stable signature (overwrite-upgrade friendly); generate
          # and upload it once on the first build.
          if ! gh release download v0.1.0 -R "${{ github.repository }}" \
              -p release.keystore -D . --clobber 2>/dev/null; then
            keytool -genkeypair -v -keystore release.keystore -alias release \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass android \
              -keypass android -dname "CN=dsh-mobile, OU=ci, O=dsh, L=cn, S=cn, C=cn"
            gh release upload v0.1.0 -R "${{ github.repository }}" release.keystore --clobber
          fi
          ls -la release.keystore

      - name: Cross-compile node-pty for ${{ matrix.abi }}
        run: |
          # node-pty 1.1.0 (matches the snapshot) rebuilt against node v24.18.0
          # headers (matches the snapshot node) with static libc++ so the
          # module depends only on system libs. It replaces the snapshot's
          # build/Release/pty.node at install time (the snapshot copy fails to
          # dlopen on some devices).
          NODE_VER=v24.18.0
          curl -sL -o /tmp/node-headers.tar.gz "https://nodejs.org/download/release/$NODE_VER/node-$NODE_VER-headers.tar.gz"
          mkdir -p /tmp/node-headers && tar -xzf /tmp/node-headers.tar.gz -C /tmp/node-headers --strip-components=1
          mkdir -p /tmp/pty-build && cd /tmp/pty-build
          npm init -y >/dev/null 2>&1
          npm install node-pty@1.1.0 --ignore-scripts --no-save >/dev/null 2>&1
          export NDK_TOOLCHAIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64"
          if [ "${{ matrix.abi }}" = "arm64-v8a" ]; then
            TRIPLE=aarch64-linux-android26
            GYP_ARCH=arm64
          else
            TRIPLE=x86_64-linux-android26
            GYP_ARCH=x64
          fi
          cd node_modules/node-pty
          CC="$NDK_TOOLCHAIN/bin/$TRIPLE-clang" \
          CXX="$NDK_TOOLCHAIN/bin/$TRIPLE-clang++" \
          AR="$NDK_TOOLCHAIN/bin/llvm-ar" RANLIB="$NDK_TOOLCHAIN/bin/llvm-ranlib" \
          CFLAGS="--target=$TRIPLE" \
          CXXFLAGS="--target=$TRIPLE -static-libstdc++" \
          LDFLAGS="--target=$TRIPLE -static-libstdc++" \
          npx --yes node-gyp rebuild --nodedir=/tmp/node-headers \
            --arch=$GYP_ARCH --target_arch=$GYP_ARCH --release 2>&1 | tail -3
          file build/Release/pty.node
          readelf -d build/Release/pty.node | grep NEEDED || true
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets/pty"
          cp build/Release/pty.node "$GITHUB_WORKSPACE/app/src/main/assets/pty/pty-node-${{ matrix.abi }}.so"
          ls -la "$GITHUB_WORKSPACE/app/src/main/assets/pty/"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/dsh-apk-${{ steps.tag.outputs.tag }}-${{ matrix.abi }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: apk-${{ matrix.abi }}
          path: dist/

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download APK artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body: |
            DeepSeek Harness Android shell APK ${{ steps.tag.outputs.tag }}
            - arm64-v8a: for ARM64 phones/tablets
            - x86_64: for x86_64 emulators (MuMu, LDPlayer, etc.)
          files: dist/*.apk
