name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to publish (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  diagnose-snapshot:
    name: Diagnose snapshot file modes
    runs-on: ubuntu-latest
    steps:
      - name: Download arm64 snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset_url=$(gh api repos/kelai141/dsh-mobile-apk/releases/tags/v0.10.4 \
            --jq '.assets[] | select(.name == "snapshot-arm64.tar.xz") | .url')
          curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "$asset_url" -o snapshot.tar.xz
      - name: Inspect key file modes
        run: |
          python3 - <<'EOF'
          import tarfile
          t = tarfile.open('snapshot.tar.xz', 'r:xz')
          wanted = ('usr/bin/node', 'usr/bin/bash', 'usr/lib/libtermux-exec-ld-preload.so')
          for m in t.getmembers():
              if m.name.endswith(wanted) or 'bin.js' in m.name:
                  print(f"{m.name}: mode={oct(m.mode)} size={m.size}")
          for cand in ('usr/etc/tls/openssl.cnf', 'usr/etc/ssl/openssl.cnf', 'usr/etc/tls/openssl.cnf.dist'):
              hit = [m for m in t.getmembers() if m.name == cand]
              print(cand, "->", "FOUND mode=" + oct(hit[0].mode) if hit else "missing")
          total = sum(m.size for m in t.getmembers())
          print("entries:", len(t.getmembers()), "total bytes:", total)
          EOF

  build:
    name: Build (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            snapshot_asset: snapshot-arm64.tar.xz
          - abi: x86_64
            snapshot_asset: snapshot-x86_64.tar.xz
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'platforms;android-36 platform-tools build-tools;36.0.0 ndk;27.2.12479018'
          accept-android-sdk-licenses: 'true'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download runtime snapshot (${{ matrix.abi }}) from upstream releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/assets
          asset_url=$(gh api repos/kelai141/dsh-mobile-apk/releases/tags/v0.10.4 \
            --jq '.assets[] | select(.name == "${{ matrix.snapshot_asset }}") | .url')
          [ -n "$asset_url" ] || { echo "${{ matrix.snapshot_asset }} not found upstream"; exit 1; }
          curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "$asset_url" -o app/src/main/assets/snapshot.tar.xz
          ls -lh app/src/main/assets/snapshot.tar.xz

      - name: Get CI signing key
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          # Prefer the keystore in repo secrets (stable across every build and
          # not tied to a release asset); fall back to the release asset, and
          # only generate+upload as a last resort.
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            echo "$RELEASE_KEYSTORE_B64" | base64 -d > release.keystore
            echo "using keystore from repo secret"
          elif gh release download v0.1.0 -R "${{ github.repository }}" \
              -p release.keystore -D . --clobber 2>/dev/null; then
            echo "using keystore from release asset"
          else
            keytool -genkeypair -v -keystore release.keystore -alias release \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass android \
              -keypass android -dname "CN=dsh-mobile, OU=ci, O=dsh, L=cn, S=cn, C=cn"
            gh release upload v0.1.0 -R "${{ github.repository }}" release.keystore --clobber
            echo "generated and uploaded new keystore"
          fi
          ls -la release.keystore

      - name: Package proot runtime (${{ matrix.abi }})
        run: |
          # Termux proot + libtalloc + libandroid-shmem debs, unpacked into
          # APK assets. Zero compilation: same build ecosystem as the snapshot.
          if [ "${{ matrix.abi }}" = "arm64-v8a" ]; then
            ABI=aarch64
          else
            ABI=x86_64
          fi
          BASE="https://packages.termux.dev/apt/termux-main/pool/main"
          mkdir -p /tmp/proot && cd /tmp/proot
          curl -sL -o proot.deb "$BASE/p/proot/proot_5.1.107.91_${ABI}.deb"
          curl -sL -o talloc.deb "$BASE/libt/libtalloc/libtalloc_2.4.3_${ABI}.deb"
          curl -sL -o shmem.deb "$BASE/liba/libandroid-shmem/libandroid-shmem_0.7_${ABI}.deb"
          mkdir -p x && for d in proot talloc shmem; do
            ar x $d.deb && tar -xf data.tar.xz -C x && rm -f data.tar.xz
          done
          P=x/data/data/com.termux/files
          cp "$P/usr/bin/proot" . && cp "$P/usr/lib/libtalloc.so.2" "$P/usr/lib/libandroid-shmem.so" .
          ls -la proot libtalloc.so.2 libandroid-shmem.so
          file proot | grep -q ELF || { echo "proot not ELF"; exit 1; }
          readelf --dyn-syms proot | grep -q talloc || { echo "proot missing talloc ref"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets/proot/${{ matrix.abi }}"
          cp proot libtalloc.so.2 libandroid-shmem.so "$GITHUB_WORKSPACE/app/src/main/assets/proot/${{ matrix.abi }}/"

      - name: Package unwind patch lib (${{ matrix.abi }})
        run: |
          # The snapshot's C++ runtime (libc++_shared.so) does not export
          # _Unwind_Resume (Termux links libunwind statically into each
          # binary), so dlopen of native modules like node-pty fails. Bundle
          # the snapshot's own libunwind.a into a shared lib (archive link,
          # no source) and LD_PRELOAD it to supply the missing symbol.
          mkdir -p /tmp/unwind && cd /tmp/unwind
          tar -xJf "$GITHUB_WORKSPACE/app/src/main/assets/snapshot.tar.xz" usr/lib/libunwind.a 2>/dev/null || { echo "libunwind.a not in snapshot"; exit 1; }
          # Termux compiles libunwind with -fvisibility=hidden (GLOBAL HIDDEN
          # symbols are not exported by the linker), so force the _Unwind_*
          # definitions to default visibility by patching st_other in the
          # archive members' ELF symbol tables (no binutils version needed).
          python3 - <<'PYEOF'
          import struct, sys
          def patch(path, out):
              data = bytearray(open(path, 'rb').read())
              if not data.startswith(b'!<arch>\n'):
                  sys.exit('not an ar archive')
              pos = 8
              changed = []
              while pos + 60 <= len(data):
                  hdr = bytes(data[pos:pos + 60])
                  size = int(hdr[48:58].decode().rstrip(), 10)
                  start = pos + 60
                  if len(data) >= start + 64 and data[start:start + 4] == b'\x7fELF':
                      e_shoff = struct.unpack_from('<Q', data, start + 40)[0]
                      e_shentsize = struct.unpack_from('<H', data, start + 58)[0]
                      e_shnum = struct.unpack_from('<H', data, start + 60)[0]
                      symtab_off = symtab_size = strtab_idx = None
                      for i in range(e_shnum):
                          off = start + e_shoff + i * e_shentsize
                          shtype = struct.unpack_from('<I', data, off + 4)[0]
                          if shtype == 2:
                              symtab_off = struct.unpack_from('<Q', data, off + 24)[0]
                              symtab_size = struct.unpack_from('<Q', data, off + 32)[0]
                              strtab_idx = struct.unpack_from('<I', data, off + 40)[0]
                      if symtab_off is not None and strtab_idx is not None:
                          soff = start + e_shoff + strtab_idx * e_shentsize
                          strtab_off = struct.unpack_from('<Q', data, soff + 24)[0]
                          strtab_size = struct.unpack_from('<Q', data, soff + 32)[0]
                          for k in range(symtab_size // 24):
                              so = start + symtab_off + k * 24
                              st_name = struct.unpack_from('<I', data, so)[0]
                              st_other = data[so + 5]
                              bind = data[so + 4] >> 4
                              if st_other and bind == 1:
                                  end = data.find(b'\0', start + strtab_off + st_name, start + strtab_off + strtab_size)
                                  name = bytes(data[start + strtab_off + st_name:end]).decode('latin1')
                                  if name.startswith('_Unwind'):
                                      data[so + 5] = 0
                                      changed.append(name)
                  pos = start + size + (size % 2)
              open(out, 'wb').write(bytes(data))
              uniq = sorted(set(changed))
              print('patched to default visibility:', ', '.join(uniq))
              if not uniq:
                  sys.exit('no _Unwind symbols patched')
          patch('usr/lib/libunwind.a', 'usr/lib/libunwind-export.a')
          PYEOF
          export NDK_TOOLCHAIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64"
          if [ "${{ matrix.abi }}" = "arm64-v8a" ]; then
            TRIPLE=aarch64-linux-android26
          else
            TRIPLE=x86_64-linux-android26
          fi
          "$NDK_TOOLCHAIN/bin/$TRIPLE-clang" -shared -fPIC \
            -Wl,--whole-archive usr/lib/libunwind-export.a -Wl,--no-whole-archive \
            -o libunwind-patch.so
          readelf --dyn-syms libunwind-patch.so | grep -q "_Unwind_Resume" \
            && echo "OK: _Unwind_Resume exported" \
            || { echo "FAIL: _Unwind_Resume not exported"; exit 1; }
          readelf -d libunwind-patch.so | grep NEEDED || true
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets/unwind"
          cp libunwind-patch.so "$GITHUB_WORKSPACE/app/src/main/assets/unwind/libunwind-patch-${{ matrix.abi }}.so"
          ls -la "$GITHUB_WORKSPACE/app/src/main/assets/unwind/"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/dsh-apk-${{ steps.tag.outputs.tag }}-${{ matrix.abi }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: apk-${{ matrix.abi }}
          path: dist/

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download APK artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body: |
            DeepSeek Harness Android shell APK ${{ steps.tag.outputs.tag }}
            - arm64-v8a: for ARM64 phones/tablets
            - x86_64: for x86_64 emulators (MuMu, LDPlayer, etc.)
          files: dist/*.apk
