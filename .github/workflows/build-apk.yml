name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'platforms;android-36 platform-tools build-tools;36.0.0'
          accept-android-sdk-licenses: 'true'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
      - name: Download rootfs (arm64) from dsh-arm64 releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/assets
          asset_url=$(gh api repos/dsh-io/dsh-arm64/releases/latest \
            --jq '.assets[] | select(.name | startswith("dsh-arm64-rootfs-")) | .url' | head -1)
          [ -n "$asset_url" ] || { echo "rootfs asset not found"; exit 1; }
          curl -sfL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "$asset_url" -o app/src/main/assets/rootfs.tar.xz
          ls -lh app/src/main/assets/rootfs.tar.xz
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -x lintDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: dsh-apk-fixed
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error