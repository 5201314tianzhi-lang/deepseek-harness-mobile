name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Download rootfs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/assets
          asset_url=$(gh api repos/dsh-io/dsh-arm64/releases/latest --jq '.assets[] | select(.name | startswith("dsh-arm64-rootfs-")) | .url' | head -1)
          curl -sfL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$asset_url" -o app/src/main/assets/rootfs.tar.xz
          ls -lh app/src/main/assets/rootfs.tar.xz
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -x lintDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-apk-fixed
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
