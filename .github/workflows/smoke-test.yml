name: smoke-test

# Device-level smoke test: install the released APK on an arm64 emulator and
# start MainActivity. Catches open-and-crash regressions that unit tests
# cannot (process startup, WebView init, native/asset failures). Logcat is
# dumped on failure. arm64 images run under QEMU TCG on x86_64 runners, so
# boot is slow (10-30 min) — expected.

on:
  workflow_dispatch:

jobs:
  smoke:
    # arm64 runner (M-series): the arm64-v8a emulator image runs natively
    # under Hypervisor.framework — boots in minutes instead of TCG hours.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download latest release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          asset_url=$(gh api repos/${{ github.repository }}/releases/latest \
            --jq '.assets[] | select(.name | endswith(".apk")) | .url' | head -1)
          [ -n "$asset_url" ] || { echo "no apk asset in latest release"; exit 1; }
          curl -sfL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "$asset_url" -o dist/app.apk
          ls -lh dist/app.apk

      - name: Boot arm64 emulator and start the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: arm64-v8a
          target: google_apis
          emulator-boot-timeout: 1800
          ram-size: 4096M
          cores: 4
          disable-animations: true
          emulator-options: -accel off -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            for VER in v0.1.5 v0.2.0-rc.1; do
              case $VER in
                v0.1.5) APK=dsh-apk-$VER-arm64-v8a.apk ;;
                *) APK=dsh-apk-$VER.apk ;;
              esac
              curl -sfL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
                "https://api.github.com/repos/${{ github.repository }}/releases/download/$VER/$APK" -o /tmp/app.apk
              ls -lh /tmp/app.apk
              adb install -r /tmp/app.apk
              echo "===== LAUNCH $VER ====="
              adb shell am start -W -n com.dshmobile.shell/.MainActivity || true
              sleep 15
              PID=$(adb shell pidof com.dshmobile.shell | tr -d '\r')
              echo "--- $VER pid=$PID ---"
              adb logcat -d -s AndroidRuntime:E | tail -60 || true
              adb shell "run-as com.dshmobile.shell cat files/dsh.log 2>/dev/null | tail -40" || true
              adb shell am force-stop com.dshmobile.shell
              adb logcat -c
            done
            PID=$(adb shell pidof com.dshmobile.shell | tr -d '\r')
            [ -n "$PID" ] && [ "$PID" != "0" ] || true
