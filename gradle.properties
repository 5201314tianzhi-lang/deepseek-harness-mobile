org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# Reuse task outputs across CI runs (setup-gradle caches ~/.gradle incl. the
# build cache); turns the ~1m40s compile+lint gate into a ~40s cache hit.
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=36
# AGP 9: keep the explicit Kotlin Gradle Plugin path. AGP 9 enables built-in
# Kotlin and the new DSL by default, which are incompatible with KGP — the
# flutter ecosystem standard is to disable both (flutter/flutter#183910).
android.builtInKotlin=false
android.newDsl=false
